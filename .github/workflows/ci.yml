name: nix

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (torch est volumineux)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: cachix/install-nix-action@v31
      - name: Évaluer toutes les sorties (dont l'ISO et le module)
        run: nix flake check --no-build
      - name: Activer KVM (test VM NixOS)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Construire la GUI et lancer les tests (imports, unitaires, VM NixOS)
        run: |
          nix build -L .#lerobot-gui \
            .#checks.x86_64-linux.imports \
            .#checks.x86_64-linux.gui-tests \
            .#checks.x86_64-linux.vm
      - name: Afficher la révision figée de nixpkgs et le hash du résultat
        run: |
          nix flake metadata --json | jq -r '.locks.nodes.nixpkgs.locked | "nixpkgs \(.rev)"'
          nix path-info .#lerobot-gui
